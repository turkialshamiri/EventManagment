<header class="header">
  <div class="header__start">
    <button type="button" class="menu-btn" (click)="menuToggle.emit()" aria-label="فتح القائمة">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <div class="date-block">
      <span class="material-symbols-outlined">calendar_today</span>
      <span class="t-label-md">{{ todayLabel }}</span>
    </div>
    <div class="occupancy t-label-sm">
      إشغال القاعات:
      <strong>{{ occupancy }}%</strong>
    </div>
  </div>

  <div class="search">
    <span class="material-symbols-outlined search__icon">search</span>
    <input
      type="search"
      class="search__input"
      placeholder="ابحث عن مناسبة، ضيف، قاعة..."
      aria-label="بحث عام"
    />
    <kbd class="search__kbd">Ctrl + K</kbd>
  </div>

  <div class="header__end">
    <button type="button" class="notify" aria-label="الإشعارات">
      <span class="material-symbols-outlined">notifications</span>
      <span class="notify__badge">3</span>
    </button>
    <a routerLink="/events/new" class="em-btn em-btn--primary">
      <span class="material-symbols-outlined">add_circle</span>
      <span>+ مناسبة جديدة</span>
    </a>
  </div>
</header>
